  <script>
    /* ==========================================================================
       1. EMBEDDED PURE-JS ZIP WRITER (ZERO DEPENDENCY PKZIP IMPLEMENTATION)
       ========================================================================== */
    class MinimalZip {
      constructor() {
        this.files = [];
      }
      add(name, content) {
        const bytes = typeof content === 'string' ? new TextEncoder().encode(content) : content;
        this.files.push({ name, bytes });
      }
      generateBlob() {
        const crcTable = [];
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
          crcTable[n] = c >>> 0;
        }
        function getCRC(bytes) {
          let crc = 0 ^ (-1);
          for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xff];
          return (crc ^ (-1)) >>> 0;
        }

        const now = new Date();
        const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
        const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

        const localHeaders = [];
        const centralEntries = [];
        let offset = 0;

        for (const file of this.files) {
          const nameBytes = new TextEncoder().encode(file.name);
          const crc = getCRC(file.bytes);
          const size = file.bytes.length;

          // Local file header (30 bytes + name + data)
          const lfh = new Uint8Array(30 + nameBytes.length);
          const lView = new DataView(lfh.buffer);
          lView.setUint32(0, 0x04034b50, true);
          lView.setUint16(4, 20, true);
          lView.setUint16(6, 0x0800, true);
          lView.setUint16(8, 0, true);
          lView.setUint16(10, dosTime, true);
          lView.setUint16(12, dosDate, true);
          lView.setUint32(14, crc, true);
          lView.setUint32(18, size, true);
          lView.setUint32(22, size, true);
          lView.setUint16(26, nameBytes.length, true);
          lView.setUint16(28, 0, true);
          lfh.set(nameBytes, 30);

          localHeaders.push(lfh, file.bytes);

          // Central directory entry (46 bytes + name)
          const cde = new Uint8Array(46 + nameBytes.length);
          const cView = new DataView(cde.buffer);
          cView.setUint32(0, 0x02014b50, true);
          cView.setUint16(4, 20, true);
          cView.setUint16(6, 20, true);
          cView.setUint16(8, 0x0800, true);
          cView.setUint16(10, 0, true);
          cView.setUint16(12, dosTime, true);
          cView.setUint16(14, dosDate, true);
          cView.setUint32(16, crc, true);
          cView.setUint32(20, size, true);
          cView.setUint32(24, size, true);
          cView.setUint16(28, nameBytes.length, true);
          cView.setUint16(30, 0, true);
          cView.setUint16(32, 0, true);
          cView.setUint16(34, 0, true);
          cView.setUint32(36, 0, true);
          cView.setUint32(42, offset, true);
          cde.set(nameBytes, 46);

          centralEntries.push(cde);
          offset += lfh.length + size;
        }

        const cdOffset = offset;
        let cdSize = 0;
        for (const cd of centralEntries) cdSize += cd.length;

        const eocd = new Uint8Array(22);
        const eView = new DataView(eocd.buffer);
        eView.setUint32(0, 0x06054b50, true);
        eView.setUint16(4, 0, true);
        eView.setUint16(6, 0, true);
        eView.setUint16(8, this.files.length, true);
        eView.setUint16(10, this.files.length, true);
        eView.setUint32(12, cdSize, true);
        eView.setUint32(16, cdOffset, true);
        eView.setUint16(20, 0, true);

        return new Blob([...localHeaders, ...centralEntries, eocd], { type: "application/zip" });
      }
    }

    /* ==========================================================================
       2. STATE, CONFIGURATION, THEMES & SNAPSHOT REGISTRY
       ========================================================================== */
    const STORAGE_KEY = "webpi_config_settings_v1";

    const DEFAULT_SETTINGS = {
      theme: "dark",
      baseUrl: "http://localhost:1234/v1",
      api: "openai-completions",
      apiKey: "apiKey",
      model: "local-model",
      reasoningEffort: "default",
      contextWindow: 262144,
      maxTokens: 98304,
      systemPrompt: `You are WebPi, an autonomous coding agent.
You can read, write, edit, delete, and move files to implement the requested software.
Always inspect existing code before making edits.
When editing files with edit_file:
- Ensure 'old_str' has sufficient unique lines of context so it only matches once.
- If making multiple distinct changes to the same file, do them carefully, or use write_file if rewriting large portions of the file is cleaner.
Keep reasoning concise and start tool execution directly once you have a plan.
When creating web apps, make sure HTML, JS, and CSS files are properly structured and linked.
Use the provided tools systematically to complete all user requests accurately.`
    };

    let settings = { ...DEFAULT_SETTINGS };
    let files = {};
    let folders = new Set();
    let activeFilePath = "";

    // State Snapshots (id -> { id, timestamp, description, files, folders, activeFilePath })
    let snapshots = {};

    // Latest State Tracking & Rollback Management
    let latestState = null;
    let isViewingRollback = false;
    let currentRollbackCheckpoint = "";

    let chatHistory = [];
    let isAgentRunning = false;
    let abortController = null;

    function applyTheme(themeName) {
      const validTheme = ["dark", "light", "nord", "cyberpunk", "matrix"].includes(themeName) ? themeName : "dark";
      document.documentElement.setAttribute("data-theme", validTheme);
      const sel = document.getElementById("themeSelect");
      if (sel) sel.value = validTheme;
      const cfgSel = document.getElementById("cfgTheme");
      if (cfgSel) cfgSel.value = validTheme;
    }

    function changeTheme(themeName) {
      settings.theme = themeName || "dark";
      applyTheme(settings.theme);
      persistSettings();
    }

    function loadPersistedSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          settings = { ...DEFAULT_SETTINGS, ...parsed };
        }
      } catch (e) {
        console.warn("Could not load stored configuration:", e);
      }
      applyTheme(settings.theme || "dark");
    }

    function persistSettings() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
      } catch (e) {
        console.warn("Could not persist configuration:", e);
      }
    }

    /* ==========================================================================
       3. WORKSPACE SNAPSHOT & ROLLBACK ENGINE
       ========================================================================== */
    function recordLatestState(description) {
      latestState = {
        timestamp: new Date().toLocaleTimeString(),
        description: description || "Latest version",
        files: JSON.parse(JSON.stringify(files)),
        folders: Array.from(folders),
        activeFilePath: activeFilePath
      };
    }

    function updateRollbackUI() {
      const banner = document.getElementById("rollbackBanner");
      const cpName = document.getElementById("rollbackCheckpointName");
      const restoreBtn = document.getElementById("restoreLatestBtn");

      if (isViewingRollback && latestState) {
        if (banner) {
          banner.style.display = "flex";
          if (cpName) cpName.innerText = currentRollbackCheckpoint || "Checkpoint";
        }
        if (restoreBtn) {
          restoreBtn.classList.remove("hidden");
        }
      } else {
        if (banner) banner.style.display = "none";
        if (restoreBtn) {
          restoreBtn.classList.add("hidden");
        }
      }
    }

    function captureSnapshot(description) {
      const id = "snap_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
      snapshots[id] = {
        id,
        timestamp: new Date().toLocaleTimeString(),
        description: description || "State before tool execution",
        files: JSON.parse(JSON.stringify(files)),
        folders: Array.from(folders),
        activeFilePath: activeFilePath
      };
      updateSnapshotCountBadge();
      return id;
    }

    function restoreSnapshot(snapId, event) {
      if (event) event.stopPropagation();
      const snap = snapshots[snapId];
      if (!snap) return alert("Snapshot checkpoint not found.");

      if (!isViewingRollback || !latestState) {
        recordLatestState("Latest version before rollback");
      }

      const fileCount = Object.keys(snap.files).length;
      const ok = confirm(`↩ Roll back workspace files to checkpoint:\n\n"${snap.description}"\nCaptured at: ${snap.timestamp} (${fileCount} files)\n\nExisting files will be replaced with this checkpoint.\n\nYou can restore the latest version at any time using "Restore Latest".`);
      if (!ok) return;

      captureSnapshot(`State before rollback to: ${snap.description}`);

      files = JSON.parse(JSON.stringify(snap.files));
      folders = new Set(snap.folders || []);
      activeFilePath = (snap.activeFilePath in files) ? snap.activeFilePath : (Object.keys(files)[0] || "");
      isViewingRollback = true;
      currentRollbackCheckpoint = snap.description;

      renderFileTree();
      loadFileToEditor(activeFilePath);
      refreshPreview();
      updateSnapshotCountBadge();
      updateRollbackUI();

      addChatMessage(
        "system",
        `↩ Restored workspace state to checkpoint: "${escapeHtml(snap.description)}" (${snap.timestamp}). <button class="btn" style="display:inline-flex; align-items:center; gap:3px; background:rgba(16,185,129,0.25); border:1px solid rgba(16,185,129,0.5); color:#86efac; font-weight:600; padding:2px 8px; font-size:11px; margin-left:6px; vertical-align:middle; border-radius:4px; cursor:pointer;" onclick="restoreLatestState()">⤴ Restore Latest Version</button>`,
        null, null, null, null, true
      );
      closeSnapshotsModal();
    }

    function restoreLatestState(event) {
      if (event) event.stopPropagation();
      if (!latestState) {
        return alert("No latest version recorded yet.");
      }

      const ok = confirm(`⤴ Restore workspace to the latest version?\n\nCaptured at: ${latestState.timestamp} (${Object.keys(latestState.files).length} files)\n\nAll historical rollbacks will be undone and your project will be returned to its head state.`);
      if (!ok) return;

      files = JSON.parse(JSON.stringify(latestState.files));
      folders = new Set(latestState.folders || []);
      activeFilePath = (latestState.activeFilePath in files) ? latestState.activeFilePath : (Object.keys(files)[0] || "");
      isViewingRollback = false;
      currentRollbackCheckpoint = "";

      renderFileTree();
      loadFileToEditor(activeFilePath);
      refreshPreview();
      updateSnapshotCountBadge();
      updateRollbackUI();

      addChatMessage("system", `⤴ Restored workspace to the latest version (${latestState.timestamp}).`);
      closeSnapshotsModal();
    }

    function updateSnapshotCountBadge() {
      const badge = document.getElementById("snapshotCountBadge");
      const count = Object.keys(snapshots).length;
      if (badge) badge.innerText = `${count} snapshot${count === 1 ? '' : 's'}`;
    }

    function openSnapshotsModal() {
      const modal = document.getElementById("snapshotsModal");
      const list = document.getElementById("snapshotsListContainer");
      list.innerHTML = "";

      if (latestState) {
        const latestCard = document.createElement("div");
        latestCard.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:rgba(16, 185, 129, 0.08); border:1px solid rgba(16, 185, 129, 0.4); border-radius:8px; margin-bottom:6px;";
        const fileCount = Object.keys(latestState.files || {}).length;
        latestCard.innerHTML = `
          <div style="overflow:hidden; margin-right:8px;">
            <div style="font-weight:700; color:#86efac; font-size:12px; display:flex; align-items:center; gap:6px;">
              <span>★</span> Latest Version (Head)
              ${!isViewingRollback ? '<span class="badge" style="background:rgba(16,185,129,0.25); color:#86efac; border-color:rgba(16,185,129,0.4); font-size:10px; padding:1px 6px;">Active</span>' : ''}
            </div>
            <div style="font-size:10px; color:var(--text-dim); margin-top:2px;">
              ${escapeHtml(latestState.timestamp)} &bull; ${fileCount} files &bull; Active: ${escapeHtml(latestState.activeFilePath || "(none)")}
            </div>
          </div>
          ${isViewingRollback ? `
            <button class="btn" style="background:rgba(16, 185, 129, 0.25); border:1px solid rgba(16, 185, 129, 0.6); color:#86efac; font-weight:600; font-size:11px; padding:4px 10px;" onclick="restoreLatestState(event)">
              ⤴ Restore Latest
            </button>
          ` : `
            <span style="font-size:11px; color:#86efac; font-weight:500;">Currently at latest</span>
          `}
        `;
        list.appendChild(latestCard);
      }

      const snapList = Object.values(snapshots).reverse();

      if (snapList.length === 0 && !latestState) {
        list.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-dim);">No checkpoints captured yet. WebPi automatically takes a snapshot before every tool execution.</div>`;
      } else {
        snapList.forEach(snap => {
          const item = document.createElement("div");
          item.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--bg-darkest); border:1px solid var(--border-color); border-radius:8px;";
          item.innerHTML = `
            <div style="overflow:hidden; margin-right:8px;">
              <div style="font-weight:600; color:var(--text-main); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
                ${escapeHtml(snap.description)}
              </div>
              <div style="font-size:10px; color:var(--text-dim); margin-top:2px;">
                ${escapeHtml(snap.timestamp)} &bull; ${Object.keys(snap.files).length} files &bull; Active: ${escapeHtml(snap.activeFilePath || "(none)")}
              </div>
            </div>
            <button class="btn" style="color:var(--accent-amber); border:1px solid rgba(245,158,11,0.4); font-size:11px; padding:3px 8px;" onclick="restoreSnapshot('${snap.id}', event)">
              ↩ Restore
            </button>
          `;
          list.appendChild(item);
        });
      }

      modal.style.display = "flex";
    }

    function closeSnapshotsModal() {
      document.getElementById("snapshotsModal").style.display = "none";
    }

    function clearAllSnapshots() {
      if (confirm("Clear all captured workspace snapshots? (The current project state and latest version will remain intact)")) {
        snapshots = {};
        updateSnapshotCountBadge();
        openSnapshotsModal();
      }
    }

    /* ==========================================================================
       4. TOOL DEFINITIONS & SAFE EXECUTOR
       ========================================================================== */
    const AGENT_TOOLS = [
      {
        type: "function",
        function: {
          name: "read_file",
          description: "Read the full contents of a file from the workspace.",
          parameters: {
            type: "object",
            properties: { path: { type: "string" } },
            required: ["path"]
          }
        }
      },
      {
        type: "function",
        function: {
          name: "write_file",
          description: "Create a new file or overwrite an existing file with complete content.",
          parameters: {
            type: "object",
            properties: { path: { type: "string" }, content: { type: "string" } },
            required: ["path", "content"]
          }
        }
      },
      {
        type: "function",
        function: {
          name: "edit_file",
          description: "Perform an exact search-and-replace on a target file. Provide enough unique surrounding context in old_str to ensure a single unique match.",
          parameters: {
            type: "object",
            properties: {
              path: { type: "string", description: "Path to the file to edit." },
              old_str: { type: "string", description: "The exact existing text block to be replaced (including surrounding context)." },
              new_str: { type: "string", description: "The new replacement text." }
            },
            required: ["path", "old_str", "new_str"]
          }
        }
      },
      {
        type: "function",
        function: {
          name: "delete_file",
          description: "Delete a file from the workspace.",
          parameters: {
            type: "object",
            properties: { path: { type: "string" } },
            required: ["path"]
          }
        }
      },
      {
        type: "function",
        function: {
          name: "create_folder",
          description: "Create a new folder directory in the workspace.",
          parameters: {
            type: "object",
            properties: { path: { type: "string" } },
            required: ["path"]
          }
        }
      },
      {
        type: "function",
        function: {
          name: "delete_folder",
          description: "Delete a folder and all files inside it.",
          parameters: {
            type: "object",
            properties: { path: { type: "string" } },
            required: ["path"]
          }
        }
      },
      {
        type: "function",
        function: {
          name: "move_file",
          description: "Move or rename a file to another folder or filename.",
          parameters: {
            type: "object",
            properties: { source_path: { type: "string" }, target_path: { type: "string" } },
            required: ["source_path", "target_path"]
          }
        }
      }
    ];

    function normalizePath(p) {
      return p ? p.replace(/^\.\//, "").replace(/^\/+/, "").trim() : "";
    }

    function resolveToolName(rawName) {
      if (!rawName) return "";
      const clean = rawName.trim().toLowerCase();
      const validNames = AGENT_TOOLS.map(t => t.function.name);
      if (validNames.includes(clean)) return clean;
      for (const valid of validNames) {
        if (clean.startsWith(valid) || clean.includes(valid)) return valid;
      }
      return clean;
    }

    function executeTool(rawName, args) {
      const name = resolveToolName(rawName);
      console.log(`[WebPi Tool Call] Execution started: ${name}`, { tool: name, rawName, arguments: args });

      if (name !== "read_file" && isViewingRollback) {
        isViewingRollback = false;
        updateRollbackUI();
      }

      try {
        let result;
        switch (name) {
          case "read_file": {
            const p = normalizePath(args.path);
            if (!(p in files)) {
              result = `Error: File '${p}' does not exist. Available files: ${Object.keys(files).join(", ") || "(none)"}`;
            } else {
              result = files[p];
            }
            break;
          }
          case "write_file": {
            const p = normalizePath(args.path);
            if (!p) {
              result = `Error: No path provided.`;
              break;
            }
            files[p] = args.content || "";
            const parts = p.split("/");
            if (parts.length > 1) {
              for (let i = 1; i < parts.length; i++) folders.add(parts.slice(0, i).join("/"));
            }
            if (!activeFilePath) activeFilePath = p;
            renderFileTree();
            if (activeFilePath === p) loadFileToEditor(p);
            refreshPreview();
            recordLatestState(`After write_file (${p})`);
            result = `Successfully wrote ${args.content?.length || 0} bytes to ${p}`;
            break;
          }
          case "edit_file": {
            const p = normalizePath(args.path);
            if (!(p in files)) {
              result = `Error: File '${p}' does not exist.`;
              break;
            }
            if (typeof args.old_str !== "string" || typeof args.new_str !== "string") {
              result = `Error: 'old_str' and 'new_str' must both be strings.`;
              break;
            }

            const currentNormalized = files[p].replace(/\r\n/g, "\n");
            const oldNormalized = args.old_str.replace(/\r\n/g, "\n");
            const newNormalized = args.new_str.replace(/\r\n/g, "\n");

            const count = currentNormalized.split(oldNormalized).length - 1;

            if (count === 0) {
              result = `Error: 'old_str' was not found in '${p}'. Check exact whitespace, indentation, or call read_file to inspect current contents.`;
              break;
            }
            if (count > 1) {
              result = `Error: 'old_str' matched ${count} times in '${p}'. Please include more surrounding context lines in 'old_str' to make the match unique.`;
              break;
            }

            files[p] = currentNormalized.replace(oldNormalized, () => newNormalized);
            renderFileTree();
            if (activeFilePath === p) loadFileToEditor(p);
            refreshPreview();
            recordLatestState(`After edit_file (${p})`);
            result = `Successfully edited '${p}' (replaced 1 instance).`;
            break;
          }
          case "delete_file": {
            const p = normalizePath(args.path);
            if (!(p in files)) {
              result = `Error: File '${p}' does not exist.`;
              break;
            }
            delete files[p];
            if (activeFilePath === p) activeFilePath = Object.keys(files)[0] || "";
            renderFileTree();
            loadFileToEditor(activeFilePath);
            refreshPreview();
            recordLatestState(`After delete_file (${p})`);
            result = `Deleted file ${p}`;
            break;
          }
          case "create_folder": {
            const p = normalizePath(args.path);
            folders.add(p);
            renderFileTree();
            recordLatestState(`After create_folder (${p})`);
            result = `Created folder '${p}'`;
            break;
          }
          case "delete_folder": {
            const p = normalizePath(args.path);
            let count = 0;
            for (const f in files) {
              if (f === p || f.startsWith(p + "/")) { delete files[f]; count++; }
            }
            folders.delete(p);
            for (const fld of Array.from(folders)) {
              if (fld.startsWith(p + "/")) folders.delete(fld);
            }
            renderFileTree();
            if (!(activeFilePath in files)) activeFilePath = Object.keys(files)[0] || "";
            loadFileToEditor(activeFilePath);
            refreshPreview();
            recordLatestState(`After delete_folder (${p})`);
            result = `Deleted folder '${p}' and ${count} contained files.`;
            break;
          }
          case "move_file": {
            const src = normalizePath(args.source_path);
            let tgt = normalizePath(args.target_path);
            if (!(src in files)) {
              result = `Error: Source '${src}' does not exist.`;
              break;
            }
            if (folders.has(tgt) || tgt.endsWith("/")) tgt = (tgt.endsWith("/") ? tgt : tgt + "/") + src.split("/").pop();
            files[tgt] = files[src];
            delete files[src];
            if (activeFilePath === src) activeFilePath = tgt;
            renderFileTree();
            loadFileToEditor(activeFilePath);
            refreshPreview();
            recordLatestState(`After move_file (${src} -> ${tgt})`);
            result = `Moved '${src}' to '${tgt}'`;
            break;
          }
          default:
            result = `Error: Unknown tool '${rawName}'`;
            break;
        }
        console.log(`[WebPi Tool Result] Completed: ${name}`, { tool: name, result });
        return result;
      } catch (err) {
        console.error(`[WebPi Tool Error] Failed: ${name}`, { tool: name, error: err.message });
        return `Execution error: ${err.message}`;
      }
    }

    function getToolCallResponse(call, msgIdx) {
      if (!call) return null;
      if (call.response !== undefined && call.response !== null) {
        return {
          content: call.response,
          snapshotId: call.snapshotId
        };
      }

      if (call.id) {
        const match = chatHistory.find(m => m.role === "tool" && m.tool_call_id === call.id);
        if (match) {
          return {
            content: match.content,
            snapshotId: match.snapshotId || call.snapshotId,
            name: match.name
          };
        }
      }

      if (msgIdx !== undefined && msgIdx >= 0) {
        for (let i = msgIdx + 1; i < chatHistory.length; i++) {
          const nextMsg = chatHistory[i];
          if (nextMsg.role === "assistant" || nextMsg.role === "user") break;
          if (nextMsg.role === "tool" && (!nextMsg.tool_call_id || nextMsg.tool_call_id === call.id)) {
            return {
              content: nextMsg.content,
              snapshotId: nextMsg.snapshotId || call.snapshotId,
              name: nextMsg.name
            };
          }
        }
      }

      return null;
    }

    /* ==========================================================================
       5. CONTEXT BUDGET ESTIMATOR & STREAMING AGENT LOOP
       ========================================================================== */
    function estimateTokens(text) {
      if (!text) return 0;
      return Math.ceil(text.length / 3.4);
    }

    function buildContextMessages(systemMessage) {
      const maxCtx = parseInt(settings.contextWindow, 10) || 32768;
      const maxOut = parseInt(settings.maxTokens, 10) || 4096;
      
      const reservedOutput = Math.min(maxOut, Math.floor(maxCtx * 0.35));
      const budget = Math.max(4096, maxCtx - reservedOutput);

      const firstUserIdx = chatHistory.findIndex(m => m.role === "user");
      if (firstUserIdx === -1) return [systemMessage];

      const conversationHistory = chatHistory.slice(firstUserIdx);

      const validHistory = conversationHistory
        .filter(m => m.role !== "system" && m.role !== "ui-error")
        .filter(m => (m.content && m.content.trim() !== "") || (m.tool_calls && m.tool_calls.length > 0) || m.role === "tool")
        .map(m => {
          const item = { role: m.role, content: m.content || "" };
          if (m.tool_calls) item.tool_calls = m.tool_calls;
          if (m.tool_call_id) {
            item.tool_call_id = m.tool_call_id;
            item.name = m.name;
          }
          return item;
        });

      if (validHistory.length === 0) return [systemMessage];

      const initialUserMsg = validHistory[0];
      const subsequentTurns = validHistory.slice(1);

      function calcTokens(msgs) {
        return msgs.reduce((acc, m) => {
          return acc + estimateTokens(m.content) + estimateTokens(JSON.stringify(m.tool_calls || ""));
        }, 0);
      }

      let totalEst = estimateTokens(systemMessage.content) +
                     calcTokens([initialUserMsg]) +
                     calcTokens(subsequentTurns);

      while (subsequentTurns.length > 2 && totalEst > budget) {
        const removed = subsequentTurns.shift();
        totalEst -= (estimateTokens(removed.content) + estimateTokens(JSON.stringify(removed.tool_calls || "")));
      }

      while (subsequentTurns.length > 0 && subsequentTurns[0].role === "tool") {
        subsequentTurns.shift();
      }

      return [systemMessage, initialUserMsg, ...subsequentTurns];
    }

    async function handleSendPrompt(e) {
      if (e) e.preventDefault();
      const input = document.getElementById("promptInput");
      const userText = input.value.trim();
      if (!userText || isAgentRunning) return;

      input.value = "";
      addChatMessage("user", userText);
      await runAgentLoop();
    }

    async function runAgentLoop() {
      isAgentRunning = true;
      abortController = new AbortController();
      setAgentStatus(true, "WebPi is thinking...");

      const systemMessage = {
        role: "system",
        content: `${settings.systemPrompt}\n\nCURRENT WORKSPACE FILES:\n${Object.keys(files).join("\n") || "(empty)"}`
      };

      let loopCount = 0;
      const MAX_LOOPS = 25;

      while (isAgentRunning && loopCount < MAX_LOOPS) {
        loopCount++;

        const payloadMessages = buildContextMessages(systemMessage);
        const currentMsgIndex = chatHistory.length;

        chatHistory.push({
          role: "assistant",
          content: "",
          reasoning: "",
          reasoningOpen: false,
          tool_calls: null,
          toolCallsOpen: {},
          toolResponsesOpen: {}
        });
        renderChatMessages();

        let streamedRawContent = "";
        let streamedReasoning = "";
        let toolCallMap = {};
        let finishReason = null;

        try {
          setAgentStatus(true, `Streaming response (turn ${loopCount})...`);

          const endpoint = `${settings.baseUrl.replace(/\/+$/, "")}/chat/completions`;
          const tokenLimit = parseInt(settings.maxTokens, 10) || DEFAULT_SETTINGS.maxTokens;

          const requestBody = {
            model: settings.model || "local-model",
            messages: payloadMessages,
            tools: AGENT_TOOLS,
            tool_choice: "auto",
            stream: true,
            max_tokens: tokenLimit,
            max_completion_tokens: tokenLimit
          };

          if (settings.reasoningEffort && settings.reasoningEffort !== "default") {
            requestBody.reasoning_effort = settings.reasoningEffort;
          }

          console.log(`[WebPi API Request] Turn ${loopCount}`, {
            endpoint,
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${settings.apiKey ? '***' : ''}`
            },
            body: requestBody
          });

          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${settings.apiKey}`
            },
            body: JSON.stringify(requestBody),
            signal: abortController.signal
          });

          console.log(`[WebPi API Response] Turn ${loopCount}`, {
            status: response.status,
            statusText: response.statusText,
            ok: response.ok
          });

          if (!response.ok) {
            const errBody = await response.text();
            throw new Error(`HTTP ${response.status}: ${errBody}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder("utf-8");
          let sseBuffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            sseBuffer += decoder.decode(value, { stream: true });
            const lines = sseBuffer.split("\n");
            sseBuffer = lines.pop();

            for (const line of lines) {
              const clean = line.trim();
              if (!clean || clean.startsWith(":") || clean === "data: [DONE]") continue;

              if (clean.startsWith("data: ")) {
                try {
                  const data = JSON.parse(clean.slice(6));
                  const choice = data.choices?.[0];
                  if (!choice) continue;

                  if (choice.finish_reason) finishReason = choice.finish_reason;
                  const delta = choice.delta;
                  if (!delta) continue;

                  if (delta.reasoning_content || delta.reasoning) {
                    streamedReasoning += (delta.reasoning_content || delta.reasoning);
                  }
                  if (delta.content) {
                    streamedRawContent += delta.content;
                  }

                  if (delta.tool_calls) {
                    for (const tc of delta.tool_calls) {
                      const idx = tc.index ?? 0;
                      if (!toolCallMap[idx]) {
                        toolCallMap[idx] = {
                          id: tc.id || `call_${Date.now()}_${idx}`,
                          type: "function",
                          function: { name: "", arguments: "" }
                        };
                      }
                      if (tc.id) toolCallMap[idx].id = tc.id;
                      if (tc.function?.name) {
                        const cur = toolCallMap[idx].function.name;
                        const inc = tc.function.name;
                        if (!cur) toolCallMap[idx].function.name = inc;
                        else if (cur !== inc && !cur.includes(inc)) toolCallMap[idx].function.name += inc;
                      }
                      if (tc.function?.arguments) {
                        toolCallMap[idx].function.arguments += tc.function.arguments;
                      }
                    }

                    chatHistory[currentMsgIndex].tool_calls = Object.values(toolCallMap);
                  }

                  const parsed = separateThinking(streamedRawContent, streamedReasoning);
                  chatHistory[currentMsgIndex].content = parsed.content;
                  chatHistory[currentMsgIndex].reasoning = parsed.reasoning;

                  updateStreamingDOM(currentMsgIndex, true);

                  const activeCalls = Object.values(toolCallMap);
                  if (activeCalls.length > 0) {
                    const primary = activeCalls[0];
                    const fnName = resolveToolName(primary.function.name) || primary.function.name || "tool";
                    const argsLen = primary.function.arguments.length;
                    const pathMatch = primary.function.arguments.match(/"path"\s*:\s*"([^"]+)"/);
                    const targetFile = pathMatch ? pathMatch[1] : "";
                    setAgentStatus(true, `Streaming ${fnName} ${targetFile ? '('+targetFile+')' : ''} [${argsLen.toLocaleString()} chars]...`);
                  }

                } catch (e) {}
              }
            }
          }

          if (finishReason === "length") {
            chatHistory[currentMsgIndex].content += "\n\n⚠️ *[Stopped: Output reached maximum token limit. Increase 'Max Output Tokens' in Settings if needed.]*";
          }

          const toolCalls = Object.values(toolCallMap).map(tc => ({
            ...tc,
            function: { ...tc.function, name: resolveToolName(tc.function.name) }
          }));

          chatHistory[currentMsgIndex].tool_calls = toolCalls.length > 0 ? toolCalls : null;
          renderChatMessages();

          if (toolCalls.length > 0) {
            for (const call of toolCalls) {
              const name = resolveToolName(call.function.name);
              let args = {};
              try { args = JSON.parse(call.function.arguments); } catch (e) {
                args = { raw: call.function.arguments };
              }

              const targetPath = args.path || args.source_path || "";
              const snapDesc = `Before ${name}${targetPath ? ' (' + targetPath + ')' : ''}`;
              const snapId = captureSnapshot(snapDesc);
              call.snapshotId = snapId;

              setAgentStatus(true, `Executing: ${name}...`);
              console.log(`[WebPi Agent Tool Call] ${name}`, { id: call.id, tool: name, arguments: args, snapshotId: snapId });
              const res = executeTool(name, args);
              call.response = res;
              addChatMessage("tool", res, null, call.id, name, snapId);
            }
            continue;
          }

          const fallback = parseFallbackCalls(chatHistory[currentMsgIndex].content);
          if (fallback) {
            const fallbackId = "call_fallback_" + Date.now();
            const name = resolveToolName(fallback.name);
            const targetPath = fallback.args?.path || fallback.args?.source_path || "";
            const snapDesc = `Before ${name}${targetPath ? ' (' + targetPath + ')' : ''}`;
            const snapId = captureSnapshot(snapDesc);

            const fallbackCall = {
              id: fallbackId,
              type: "function",
              function: {
                name: name,
                arguments: JSON.stringify(fallback.args)
              },
              snapshotId: snapId,
              response: null
            };

            if (!chatHistory[currentMsgIndex].tool_calls) {
              chatHistory[currentMsgIndex].tool_calls = [];
            }
            chatHistory[currentMsgIndex].tool_calls.push(fallbackCall);

            setAgentStatus(true, `Executing: ${name}...`);
            console.log(`[WebPi Fallback Tool Call] ${name}`, { tool: name, arguments: fallback.args, snapshotId: snapId });
            const res = executeTool(name, fallback.args);
            fallbackCall.response = res;
            addChatMessage("tool", res, null, fallbackId, name, snapId);
            continue;
          }

          break;

        } catch (err) {
          if (chatHistory[currentMsgIndex] && !chatHistory[currentMsgIndex].content && !chatHistory[currentMsgIndex].tool_calls) {
            chatHistory.splice(currentMsgIndex, 1);
          }

          if (err.name === "AbortError") {
            console.warn("[WebPi API Request Aborted by User]");
            addChatMessage("system", "WebPi execution stopped by user.");
          } else {
            console.error("[WebPi API Request Error]", err);
            addChatMessage("system", `⚠️ LLM Error: ${err.message}\nMake sure your endpoint (${settings.baseUrl}) is running with CORS enabled.`);
          }
          break;
        }
      }

      setAgentStatus(false);
      isAgentRunning = false;
      abortController = null;

      if (!isViewingRollback) {
        recordLatestState("Latest version at conclusion of agent loop");
      }
    }

    function separateThinking(raw, explicit) {
      let reasoning = explicit || "";
      let content = raw || "";

      if (content.includes("<think>")) {
        const parts = content.split(/<\/?think>/g);
        if (parts.length >= 3) {
          reasoning += (reasoning ? "\n\n" : "") + parts[1].trim();
          content = (parts[0] + parts.slice(2).join("")).trim();
        } else if (parts.length === 2) {
          reasoning += (reasoning ? "\n\n" : "") + parts[1];
          content = parts[0];
        }
      }
      return { reasoning: reasoning.trim(), content };
    }

    function parseFallbackCalls(text) {
      if (!text) return null;
      const m = text.match(/```(?:tool:)?(\w+)\s*\n([\s\S]*?)```/);
      if (m) {
        const name = resolveToolName(m[1]);
        if (AGENT_TOOLS.some(t => t.function.name === name)) {
          try { return { name, args: JSON.parse(m[2].trim()) }; } catch(e){}
        }
      }
      return null;
    }

    function abortAgent() {
      if (abortController) abortController.abort();
      setAgentStatus(false);
      isAgentRunning = false;
    }

    /* ==========================================================================
       6. CHAT UI RENDERING & SCROLLING MANAGEMENT
       ========================================================================== */
    function handleChatScroll() {
      const container = document.getElementById("messagesContainer");
      const btn = document.getElementById("scrollToBottomBtn");
      if (!container || !btn) return;
      
      const isNearBottom = (container.scrollHeight - container.scrollTop - container.clientHeight) <= 80;
      if (isNearBottom) {
        btn.classList.add("hidden");
      } else {
        btn.classList.remove("hidden");
      }
    }

    function scrollChatToBottom() {
      const container = document.getElementById("messagesContainer");
      if (container) {
        container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
      }
      const btn = document.getElementById("scrollToBottomBtn");
      if (btn) btn.classList.add("hidden");
    }

    function toggleThoughtProcess(idx) {
      if (chatHistory[idx]) {
        chatHistory[idx].reasoningOpen = !chatHistory[idx].reasoningOpen;
        const body = document.getElementById(`reasoning-body-${idx}`);
        const lbl = document.getElementById(`reasoning-label-${idx}`);
        if (body && lbl) {
          const isOpen = chatHistory[idx].reasoningOpen;
          body.classList.toggle("hidden", !isOpen);
          lbl.innerText = isOpen ? "hide" : "show";
        } else {
          renderChatMessages();
        }
      }
    }

    function toggleToolOutput(idx) {
      if (chatHistory[idx]) {
        chatHistory[idx].toolOutputOpen = !chatHistory[idx].toolOutputOpen;
        const body = document.getElementById(`tool-output-body-${idx}`);
        const lbl = document.getElementById(`tool-output-label-${idx}`);
        if (body && lbl) {
          const isOpen = chatHistory[idx].toolOutputOpen;
          body.classList.toggle("hidden", !isOpen);
          lbl.innerText = isOpen ? "hide" : "show";
        } else {
          renderChatMessages();
        }
      }
    }

    function toggleToolCall(msgIdx, callIdx) {
      if (chatHistory[msgIdx]) {
        if (!chatHistory[msgIdx].toolCallsOpen) chatHistory[msgIdx].toolCallsOpen = {};
        const cur = !!chatHistory[msgIdx].toolCallsOpen[callIdx];
        const newState = !cur;
        chatHistory[msgIdx].toolCallsOpen[callIdx] = newState;

        const body = document.getElementById(`tool-call-body-${msgIdx}-${callIdx}`);
        const arrow = document.getElementById(`tool-call-arrow-${msgIdx}-${callIdx}`);
        if (body) {
          body.classList.toggle("hidden", !newState);
          if (newState) body.scrollTop = 0;
        }
        if (arrow) {
          arrow.innerText = newState ? "▾" : "▸";
        }
      }
    }

    function toggleToolResponse(msgIdx, callIdx) {
      if (chatHistory[msgIdx]) {
        if (!chatHistory[msgIdx].toolResponsesOpen) chatHistory[msgIdx].toolResponsesOpen = {};
        const cur = !!chatHistory[msgIdx].toolResponsesOpen[callIdx];
        const newState = !cur;
        chatHistory[msgIdx].toolResponsesOpen[callIdx] = newState;

        const body = document.getElementById(`tool-response-body-${msgIdx}-${callIdx}`);
        const arrow = document.getElementById(`tool-response-arrow-${msgIdx}-${callIdx}`);
        if (body) {
          body.classList.toggle("hidden", !newState);
          if (newState) body.scrollTop = 0;
        }
        if (arrow) {
          arrow.innerText = newState ? "▾" : "▸";
        }
      }
    }

    function addChatMessage(role, content, tool_calls = null, tool_call_id = null, name = null, snapshotId = null, allowHtml = false) {
      chatHistory.push({
        role,
        content,
        tool_calls,
        tool_call_id,
        name,
        snapshotId,
        allowHtml,
        reasoning: "",
        reasoningOpen: false,
        toolOutputOpen: false,
        toolCallsOpen: {},
        toolResponsesOpen: {}
      });
      renderChatMessages(role === "user");
    }

    function renderChatMessages(forceScroll = false) {
      const container = document.getElementById("messagesContainer");
      if (!container) return;

      const wasAtBottom = (container.scrollHeight - container.scrollTop - container.clientHeight) <= 80;
      const prevScrollTop = container.scrollTop;

      const handledToolCallIds = new Set();
      chatHistory.forEach(m => {
        if (m.tool_calls && Array.isArray(m.tool_calls)) {
          m.tool_calls.forEach(tc => {
            if (tc.id) handledToolCallIds.add(tc.id);
          });
        }
      });

      container.innerHTML = "";
      chatHistory.forEach((msg, idx) => {
        if (msg.role === "tool" && msg.tool_call_id && handledToolCallIds.has(msg.tool_call_id)) {
          return;
        }
        container.appendChild(createMessageDOM(msg, idx, false));
      });

      if (forceScroll || wasAtBottom) {
        container.scrollTop = container.scrollHeight;
      } else {
        container.scrollTop = prevScrollTop;
      }
      handleChatScroll();
    }

    function generateToolArgsHtml(fnName, argsRaw, isStreaming = false) {
      let parsed = null;
      try {
        parsed = JSON.parse(argsRaw);
      } catch (e) {
        parsed = null;
      }

      if (parsed) {
        if (fnName === "read_file") {
          return `<div><strong>File:</strong> ${escapeHtml(parsed.path || "")}</div>`;
        } else if (fnName === "write_file") {
          return `
            <div style="margin-bottom:6px;"><strong>File:</strong> ${escapeHtml(parsed.path || "")} (${(parsed.content || "").length.toLocaleString()} chars)</div>
            <div class="tool-diff-tag" style="color:var(--accent-green);">File Content:</div>
            <pre class="diff-added">${escapeHtml(parsed.content || "")}</pre>`;
        } else if (fnName === "edit_file") {
          return `
            <div style="margin-bottom:6px;"><strong>File:</strong> ${escapeHtml(parsed.path || "")}</div>
            <div class="tool-diff-tag" style="color:var(--accent-rose);">Search Block (old_str):</div>
            <pre class="diff-removed">${escapeHtml(parsed.old_str || "")}</pre>
            <div class="tool-diff-tag" style="color:var(--accent-green); margin-top:6px;">Replacement Block (new_str):</div>
            <pre class="diff-added">${escapeHtml(parsed.new_str || "")}</pre>`;
        } else {
          return `<pre style="margin:0; font-size:11px;">${escapeHtml(JSON.stringify(parsed, null, 2))}</pre>`;
        }
      } else {
        const liveBadge = isStreaming ? `<div style="display:flex; justify-content:space-between; margin-bottom:4px; font-size:10px; color:var(--text-dim);"><span>Streaming Arguments</span><span style="color:var(--brand-light); font-weight:600;">● Live</span></div>` : "";
        return `${liveBadge}<pre style="margin:0; font-size:11px; white-space:pre-wrap; word-break:break-all;">${escapeHtml(argsRaw || "(waiting for arguments...)")}</pre>`;
      }
    }

    function renderToolCardHtml(t, msgIdx, callIdx, msg, isStreaming = false) {
      const fnName = resolveToolName(t.function?.name) || t.function?.name || "tool";
      const argsRaw = t.function?.arguments || "";
      const respObj = getToolCallResponse(t, msgIdx);
      const hasResponse = !!respObj;
      const isError = hasResponse && (
        respObj.content.startsWith("Error:") ||
        respObj.content.startsWith("Execution error:") ||
        respObj.content.includes("Execution error")
      );

      if (!msg.toolCallsOpen) msg.toolCallsOpen = {};
      if (!msg.toolResponsesOpen) msg.toolResponsesOpen = {};

      if (msg.toolResponsesOpen[callIdx] === undefined && isError) {
        msg.toolResponsesOpen[callIdx] = true;
      }

      const isCallOpen = !!msg.toolCallsOpen[callIdx];
      const isRespOpen = !!msg.toolResponsesOpen[callIdx];

      let pathTag = "";
      const pathMatch = argsRaw.match(/"path"\s*:\s*"([^"]+)"/);
      if (pathMatch) {
        pathTag = ` <span style="color:var(--text-main); font-weight:600;">(${escapeHtml(pathMatch[1])})</span>`;
      }
      const sizeTag = argsRaw.length > 0 ? ` <span style="opacity:0.7; font-size:10px;">${argsRaw.length.toLocaleString()} chars</span>` : "";
      const streamClass = isStreaming ? "streaming" : "";

      const effectiveSnapId = t.snapshotId || respObj?.snapshotId;
      const rollbackBtn = effectiveSnapId ? `
        <button type="button" class="btn" style="padding:1px 6px; font-size:10px; color:var(--accent-amber); border:1px solid rgba(245,158,11,0.4); border-radius:4px; line-height:1.4;" onclick="restoreSnapshot('${effectiveSnapId}', event)" title="Roll back workspace to state immediately before this tool ran">↩ Rollback</button>` : "";

      const argsHtml = generateToolArgsHtml(fnName, argsRaw, isStreaming);

      let responseIcon = '<span style="color:var(--accent-amber); font-weight:bold;">⚙</span>';
      let responseStatusTitle = "Status";
      let responseSummary = "Waiting for tool execution...";
      let respContent = "";
      let showDetailsToggle = false;

      if (hasResponse) {
        respContent = respObj.content || "";
        const lines = respContent.trim().split("\n");
        responseSummary = lines[0] || (isError ? "Execution failed" : "Completed");
        showDetailsToggle = lines.length > 1 || respContent.length > 70;

        if (isError) {
          responseIcon = '<span style="color:var(--accent-rose); font-weight:bold;">✕</span>';
          responseStatusTitle = "Error";
        } else {
          responseIcon = '<span style="color:var(--accent-green); font-weight:bold;">✓</span>';
          responseStatusTitle = "Result";
        }
      } else if (isStreaming) {
        responseIcon = '<span style="color:var(--brand-light); font-weight:bold;">⏳</span>';
        responseStatusTitle = "Pending";
        responseSummary = "Streaming tool arguments...";
      } else {
        responseIcon = '<span style="color:var(--accent-amber); font-weight:bold;">⏳</span>';
        responseStatusTitle = "Running";
        responseSummary = "Executing in workspace...";
      }

      return `
        <div id="tool-call-item-${msgIdx}-${callIdx}" class="tool-call-item ${isError ? 'tool-error' : ''}">
          <!-- TOP SECTION: TOOL CALL -->
          <div class="tool-call-top">
            <div id="tool-call-header-${msgIdx}-${callIdx}" class="tool-call-header ${streamClass}" onclick="toggleToolCall(${msgIdx}, ${callIdx})">
              <div class="tool-call-title-group">
                <span>⚙</span>
                <strong>${escapeHtml(fnName)}</strong>
                ${pathTag}
                ${sizeTag}
              </div>
              <div class="tool-call-actions">
                ${rollbackBtn}
                <span id="tool-call-arrow-${msgIdx}-${callIdx}" style="font-size:11px; opacity:0.75; padding:0 2px;">${isCallOpen ? '▾' : '▸'}</span>
              </div>
            </div>
            <div id="tool-call-body-${msgIdx}-${callIdx}" class="tool-call-body ${isCallOpen ? '' : 'hidden'}">
              <div id="tool-call-content-${msgIdx}-${callIdx}">${argsHtml}</div>
            </div>
          </div>

          <!-- BOTTOM SECTION: STACKED TOOL RESPONSE -->
          <div class="tool-response-bottom ${isError ? 'error' : (hasResponse ? '' : 'running')}">
            <div id="tool-response-header-${msgIdx}-${callIdx}" class="tool-response-header" onclick="${showDetailsToggle ? `toggleToolResponse(${msgIdx}, ${callIdx})` : ''}" style="${showDetailsToggle ? '' : 'cursor:default;'}">
              <div class="tool-response-summary">
                ${responseIcon}
                <span style="font-weight:600; color:${isError ? 'var(--accent-rose)' : (hasResponse ? 'var(--accent-green)' : 'var(--accent-amber)')};">
                  ${responseStatusTitle}:
                </span>
                <span style="color:var(--text-main); font-weight:normal;">${escapeHtml(responseSummary)}</span>
              </div>
              <div style="flex-shrink:0; margin-left:6px;">
                ${showDetailsToggle ? `<span id="tool-response-arrow-${msgIdx}-${callIdx}" style="font-size:11px; opacity:0.75; color:var(--brand-light); padding:0 2px;">${isRespOpen ? '▾' : '▸'}</span>` : ''}
              </div>
            </div>
            <div id="tool-response-body-${msgIdx}-${callIdx}" class="tool-response-body ${isError ? 'error' : ''} ${isRespOpen && showDetailsToggle ? '' : 'hidden'}">
              ${escapeHtml(respContent)}
            </div>
          </div>
        </div>
      `;
    }

    function renderToolCallsToContainer(toolsDiv, msg, msgIdx, isStreaming = false) {
      const toolCalls = msg.tool_calls;
      if (!toolCalls || toolCalls.length === 0) {
        toolsDiv.innerHTML = "";
        return;
      }
      toolsDiv.innerHTML = toolCalls.map((t, callIdx) => renderToolCardHtml(t, msgIdx, callIdx, msg, isStreaming)).join("");
    }

    function formatToolCalls(msg, msgIdx, isStreaming = false) {
      const toolCalls = msg.tool_calls;
      if (!toolCalls || toolCalls.length === 0) return "";
      return toolCalls.map((t, callIdx) => renderToolCardHtml(t, msgIdx, callIdx, msg, isStreaming)).join("");
    }

    function createMessageDOM(msg, idx, isStreaming = false) {
      const wrap = document.createElement("div");
      wrap.id = `msg-${idx}`;
      wrap.className = `msg-wrap ${msg.role}`;

      if (msg.role === "system") {
        wrap.innerHTML = `<div class="bubble system">${msg.allowHtml ? msg.content : escapeHtml(msg.content)}</div>`;
        return wrap;
      }

      if (msg.role === "tool") {
        const isOpen = !!msg.toolOutputOpen;
        const firstLine = (msg.content || "").trim().split("\n")[0] || "completed";
        const shortPreview = firstLine.length > 45 ? firstLine.slice(0, 45) + "..." : firstLine;

        const rollbackBtn = msg.snapshotId ? `
          <button type="button" class="btn" style="padding:1px 6px; font-size:10px; color:var(--accent-amber); border:1px solid rgba(245,158,11,0.4); border-radius:4px;" onclick="restoreSnapshot('${msg.snapshotId}', event)" title="Roll back workspace to state immediately before this tool ran">↩ Rollback</button>` : "";

        wrap.innerHTML = `
          <div class="tool-output-box">
            <button type="button" class="tool-output-header" onclick="toggleToolOutput(${idx})">
              <span>✓ <strong>${escapeHtml(msg.name || "Tool Result")}</strong> <span style="color:var(--text-dim); margin-left:6px; font-weight:normal;">${escapeHtml(shortPreview)}</span></span>
              <div style="display:flex; align-items:center;">
                ${rollbackBtn}
                <span id="tool-output-label-${idx}" style="font-size:10px; color:var(--brand-light); opacity:0.8;">${isOpen ? "hide" : "show"}</span>
              </div>
            </button>
            <div id="tool-output-body-${idx}" class="tool-output-body ${isOpen ? '' : 'hidden'}">
              <pre style="white-space:pre-wrap; font-size:11px; margin:0;">${escapeHtml(msg.content)}</pre>
            </div>
          </div>`;
        return wrap;
      }

      const isUser = msg.role === "user";
      const toolCallsHtml = formatToolCalls(msg, idx, isStreaming);

      let thoughtHtml = "";
      if (msg.reasoning) {
        const isOpen = !!msg.reasoningOpen;
        thoughtHtml = `
          <div class="thought-box">
            <button type="button" class="thought-header" onclick="toggleThoughtProcess(${idx})">
              <span>🧠 Thought Process</span>
              <span id="reasoning-label-${idx}" style="font-size:10px; color:var(--text-dim);">${isOpen ? "hide" : "show"}</span>
            </button>
            <div id="reasoning-body-${idx}" class="thought-body ${isOpen ? '' : 'hidden'}">${escapeHtml(msg.reasoning)}</div>
          </div>`;
      }

      wrap.innerHTML = `
        <div class="bubble ${isUser ? 'user' : 'assistant'}">
          <div id="msg-thought-holder-${idx}">${thoughtHtml}</div>
          <div id="msg-content-${idx}" style="white-space:pre-wrap;">${escapeHtml(msg.content)}</div>
          <div id="msg-tools-${idx}">${toolCallsHtml}</div>
        </div>`;
      return wrap;
    }

    function updateStreamingDOM(idx, isStreaming = true) {
      const msg = chatHistory[idx];
      if (!msg) return;

      const container = document.getElementById("messagesContainer");
      if (!container) return;

      const isNearBottom = (container.scrollHeight - container.scrollTop - container.clientHeight) <= 80;

      let elem = document.getElementById(`msg-${idx}`);

      if (!elem) {
        elem = createMessageDOM(msg, idx, isStreaming);
        container.appendChild(elem);
      } else {
        const cDiv = document.getElementById(`msg-content-${idx}`);
        const tHolder = document.getElementById(`msg-thought-holder-${idx}`);
        const toolsDiv = document.getElementById(`msg-tools-${idx}`);

        if (cDiv) cDiv.innerText = msg.content;

        if (msg.reasoning && tHolder && !tHolder.innerHTML.trim()) {
          const isOpen = !!msg.reasoningOpen;
          tHolder.innerHTML = `
            <div class="thought-box">
              <button type="button" class="thought-header" onclick="toggleThoughtProcess(${idx})">
                <span>🧠 Thought Process</span>
                <span id="reasoning-label-${idx}" style="font-size:10px; color:var(--text-dim);">${isOpen ? "hide" : "show"}</span>
              </button>
              <div id="reasoning-body-${idx}" class="thought-body ${isOpen ? '' : 'hidden'}">${escapeHtml(msg.reasoning)}</div>
            </div>`;
        } else if (msg.reasoning) {
          const body = document.getElementById(`reasoning-body-${idx}`);
          if (body) body.innerText = msg.reasoning;
        }

        if (toolsDiv) {
          renderToolCallsToContainer(toolsDiv, msg, idx, isStreaming);
        }
      }

      if (isNearBottom) {
        container.scrollTop = container.scrollHeight;
      }
      handleChatScroll();
    }

    function setAgentStatus(active, text = "") {
      const bar = document.getElementById("agentStatus");
      const txt = document.getElementById("agentStatusText");
      if (active) {
        bar.style.display = "flex";
        txt.innerText = text;
      } else {
        bar.style.display = "none";
      }
    }

    function clearChatHistory() {
      if (confirm("Clear conversation history?")) {
        chatHistory = [];
        renderChatMessages(true);
      }
    }

    /* ==========================================================================
       7. FILE EXPLORER & EDITOR
       ========================================================================== */
    function renderFileTree() {
      const tree = document.getElementById("fileTreeList");
      const count = document.getElementById("fileCountBadge");
      tree.innerHTML = "";

      const paths = Object.keys(files).sort();
      count.innerText = `${paths.length} file${paths.length === 1 ? '' : 's'}`;

      if (paths.length === 0 && folders.size === 0) {
        tree.innerHTML = `<div style="padding:1rem; text-align:center; color:var(--text-dim); font-size:11px;">Workspace is empty</div>`;
        return;
      }

      folders.forEach(folder => {
        const fDiv = document.createElement("div");
        fDiv.className = "file-item";
        fDiv.innerHTML = `
          <span>📁 ${escapeHtml(folder)}</span>
          <button class="btn" style="padding:0; color:var(--accent-rose);" onclick="deleteFolderPrompt('${escapeHtml(folder)}')">✕</button>`;
        tree.appendChild(fDiv);
      });

      paths.forEach(p => {
        const isActive = p === activeFilePath;
        const item = document.createElement("div");
        item.className = `file-item ${isActive ? 'active' : ''}`;
        item.onclick = (e) => { 
          if (!e.target.closest("button")) {
            loadFileToEditor(p);
            if (window.innerWidth <= 768) switchMobileTab('editor');
          }
        };
        item.innerHTML = `
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">📄 ${escapeHtml(p)}</span>
          <div style="display:flex; gap:4px;">
            <button class="btn" style="padding:0;" onclick="downloadSpecificFile('${escapeHtml(p)}')" title="Download">↓</button>
            <button class="btn" style="padding:0; color:var(--accent-rose);" onclick="deleteFilePrompt('${escapeHtml(p)}')" title="Delete">✕</button>
          </div>`;
        tree.appendChild(item);
      });
    }

    function loadFileToEditor(path) {
      activeFilePath = path;
      const editor = document.getElementById("fileEditor");
      const label = document.getElementById("activeFilePath");

      if (path && (path in files)) {
        label.innerText = path;
        label.style.color = "var(--text-main)";
        editor.value = files[path];
        editor.disabled = false;
      } else {
        label.innerText = "(No file open)";
        label.style.color = "var(--text-dim)";
        editor.value = "";
        editor.disabled = true;
      }
      renderFileTree();
    }

    function handleEditorInput() {}

    function saveActiveFileFromEditor() {
      if (!activeFilePath) return;
      captureSnapshot(`Manual edit of ${activeFilePath}`);
      files[activeFilePath] = document.getElementById("fileEditor").value;
      refreshPreview();
      isViewingRollback = false;
      updateRollbackUI();
      recordLatestState(`Manual edit of ${activeFilePath}`);
    }

    function promptCreateFile() {
      const p = prompt("New file path (e.g. index.html):");
      if (p) {
        const norm = normalizePath(p);
        if (!(norm in files)) {
          captureSnapshot(`Create file ${norm}`);
          files[norm] = "";
          loadFileToEditor(norm);
          renderFileTree();
          refreshPreview();
          isViewingRollback = false;
          updateRollbackUI();
          recordLatestState(`Create file ${norm}`);
          if (window.innerWidth <= 768) switchMobileTab('editor');
        }
      }
    }

    function promptCreateFolder() {
      const f = prompt("New folder name:");
      if (f) {
        captureSnapshot(`Create folder ${f}`);
        folders.add(normalizePath(f));
        renderFileTree();
        isViewingRollback = false;
        updateRollbackUI();
        recordLatestState(`Create folder ${f}`);
      }
    }

    function promptMoveFile() {
      if (!activeFilePath) return alert("Select a file first.");
      const tgt = prompt(`Move '${activeFilePath}' to:`, activeFilePath);
      if (tgt && tgt !== activeFilePath) {
        captureSnapshot(`Move ${activeFilePath} to ${tgt}`);
        executeTool("move_file", { source_path: activeFilePath, target_path: tgt });
      }
    }

    function deleteFilePrompt(path) {
      if (confirm(`Delete '${path}'?`)) {
        captureSnapshot(`Delete file ${path}`);
        executeTool("delete_file", { path });
      }
    }

    function deleteFolderPrompt(path) {
      if (confirm(`Delete folder '${path}' and all its files?`)) {
        captureSnapshot(`Delete folder ${path}`);
        executeTool("delete_folder", { path });
      }
    }

    /* ==========================================================================
       8. SANDBOX LIVE PREVIEW
       ========================================================================== */
    function refreshPreview() {
      const frame = document.getElementById("previewFrame");
      let html = files["index.html"] || (activeFilePath.endsWith(".html") ? files[activeFilePath] : "");

      if (!html) {
        frame.srcdoc = `<html><body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;color:#64748b;background:#0f172a;text-align:center;"><div><h3>Preview Sandbox</h3><p style="font-size:12px;">Preview your application here.</p></div></body></html>`;
        return;
      }

      let bundled = html;
      bundled = bundled.replace(/<link\s+[^>]*rel=["']stylesheet["'][^>]*href=["']([^"']+)["'][^>]*>/gi, (match, href) => {
        const n = normalizePath(href);
        return (n in files) ? `<style data-inlined="${n}">\n${files[n]}\n</style>` : match;
      });

      bundled = bundled.replace(/<script\s+[^>]*src=["']([^"']+)["'][^>]*><\/script>/gi, (match, src) => {
        const n = normalizePath(src);
        return (n in files) ? `<script data-inlined="${n}">\n${files[n]}\n<\/script>` : match;
      });

      frame.srcdoc = bundled;
    }

    function openPreviewInNewTab() {
      const frame = document.getElementById("previewFrame");
      const blob = new Blob([frame.srcdoc], { type: "text/html" });
      window.open(URL.createObjectURL(blob), "_blank");
    }

    /* ==========================================================================
       9. EXPORT / IMPORT
       ========================================================================== */
    function downloadSpecificFile(path) {
      if (!(path in files)) return;
      const blob = new Blob([files[path]], { type: "text/plain;charset=utf-8" });
      triggerDownload(blob, path.split("/").pop());
    }

    function downloadActiveFile() {
      if (activeFilePath) downloadSpecificFile(activeFilePath);
      else alert("No active file selected.");
    }

    function downloadZip() {
      const keys = Object.keys(files);
      if (keys.length === 0) return alert("Workspace is empty. Nothing to export.");
      const zip = new MinimalZip();
      for (const [p, content] of Object.entries(files)) zip.add(p, content);
      triggerDownload(zip.generateBlob(), "webpi-project.zip");
    }

    function exportSession() {
      const data = {
        version: "1.0",
        app: "WebPi",
        timestamp: new Date().toISOString(),
        settings,
        folders: Array.from(folders),
        files,
        chatHistory,
        activeFilePath,
        snapshots,
        latestState,
        isViewingRollback,
        currentRollbackCheckpoint
      };
      triggerDownload(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }), `webpi-session-${new Date().toISOString().slice(0,10)}.json`);
    }

    function importSession(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const data = JSON.parse(evt.target.result);
          if (data.files !== undefined && data.chatHistory !== undefined) {
            files = data.files;
            folders = new Set(data.folders || []);
            chatHistory = data.chatHistory;
            snapshots = data.snapshots || {};
            latestState = data.latestState || null;
            isViewingRollback = !!data.isViewingRollback;
            currentRollbackCheckpoint = data.currentRollbackCheckpoint || "";

            if (!latestState) {
              recordLatestState("Imported session state");
            }

            if (data.settings) {
              settings = { ...settings, ...data.settings };
              persistSettings();
              applyTheme(settings.theme || "dark");
            }
            activeFilePath = data.activeFilePath || Object.keys(files)[0] || "";
            updateSettingsUI();
            updateSnapshotCountBadge();
            updateRollbackUI();
            renderFileTree();
            loadFileToEditor(activeFilePath);
            renderChatMessages();
            refreshPreview();
            alert("Session restored successfully!");
          }
        } catch (err) {
          alert("Error restoring session: " + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }

    function triggerDownload(blob, name) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
    }

    /* ==========================================================================
       10. SETTINGS MANAGEMENT (FULL LOCALSTORAGE SUPPORT)
       ========================================================================== */
    function openSettings() {
      document.getElementById("cfgTheme").value = settings.theme || "dark";
      document.getElementById("cfgBaseUrl").value = settings.baseUrl;
      document.getElementById("cfgApiKey").value = settings.apiKey;
      document.getElementById("cfgApi").value = settings.api;
      document.getElementById("cfgModel").value = settings.model;
      document.getElementById("cfgReasoningEffort").value = settings.reasoningEffort || "default";
      document.getElementById("cfgContextWindow").value = settings.contextWindow;
      document.getElementById("cfgMaxTokens").value = settings.maxTokens;
      document.getElementById("cfgSystemPrompt").value = settings.systemPrompt;
      document.getElementById("settingsModal").style.display = "flex";
    }

    function closeSettings() {
      document.getElementById("settingsModal").style.display = "none";
    }

    function saveSettings() {
      const rawTheme = document.getElementById("cfgTheme").value;
      const rawBase = document.getElementById("cfgBaseUrl").value.trim();
      const rawKey = document.getElementById("cfgApiKey").value.trim();
      const rawApi = document.getElementById("cfgApi").value;
      const rawModel = document.getElementById("cfgModel").value.trim();
      const rawReasoning = document.getElementById("cfgReasoningEffort").value;
      const rawCtx = parseInt(document.getElementById("cfgContextWindow").value, 10);
      const rawMaxTok = parseInt(document.getElementById("cfgMaxTokens").value, 10);
      const rawSys = document.getElementById("cfgSystemPrompt").value;

      settings.theme = rawTheme || DEFAULT_SETTINGS.theme;
      settings.baseUrl = rawBase || DEFAULT_SETTINGS.baseUrl;
      settings.apiKey = rawKey !== "" ? rawKey : DEFAULT_SETTINGS.apiKey;
      settings.api = rawApi || DEFAULT_SETTINGS.api;
      settings.model = rawModel || DEFAULT_SETTINGS.model;
      settings.reasoningEffort = rawReasoning || DEFAULT_SETTINGS.reasoningEffort;
      settings.contextWindow = !isNaN(rawCtx) && rawCtx > 0 ? rawCtx : DEFAULT_SETTINGS.contextWindow;
      settings.maxTokens = !isNaN(rawMaxTok) && rawMaxTok > 0 ? rawMaxTok : DEFAULT_SETTINGS.maxTokens;
      settings.systemPrompt = rawSys !== "" ? rawSys : DEFAULT_SETTINGS.systemPrompt;

      applyTheme(settings.theme);
      persistSettings();
      updateSettingsUI();
      closeSettings();
    }

    function updateSettingsUI() {
      document.getElementById("modelBadge").innerText = settings.model;
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    /* ==========================================================================
       11. DRAGGABLE CENTRE CROSS-HANDLE RESIZING & MOBILE TABS
       ========================================================================== */
    function switchMobileTab(tab) {
      const ws = document.getElementById("workspace");
      if (ws) ws.setAttribute("data-mobile-tab", tab);
      document.querySelectorAll(".mobile-tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.getAttribute("data-tab") === tab);
      });
      if (tab === "preview") refreshPreview();
    }

    function initResizeHandle() {
      const handle = document.getElementById("centerResizeHandle");
      const workspace = document.getElementById("workspace");
      if (!handle || !workspace) return;

      let isDragging = false;

      function onPointerDown(e) {
        if (window.innerWidth <= 768) return;
        isDragging = true;
        handle.classList.add("active");
        document.body.style.userSelect = "none";
        document.body.style.cursor = "all-scroll";

        const preview = document.getElementById("previewFrame");
        if (preview) preview.style.pointerEvents = "none";

        try {
          handle.setPointerCapture(e.pointerId);
        } catch (err) {}

        e.preventDefault();
      }

      function onPointerMove(e) {
        if (!isDragging) return;
        const rect = workspace.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;

        const px = ((e.clientX - rect.left) / rect.width) * 100;
        const py = ((e.clientY - rect.top) / rect.height) * 100;

        const clampedX = Math.max(15, Math.min(85, px));
        const clampedY = Math.max(15, Math.min(85, py));

        workspace.style.setProperty("--split-x", `${clampedX}%`);
        workspace.style.setProperty("--split-y", `${clampedY}%`);
      }

      function onPointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        handle.classList.remove("active");
        document.body.style.userSelect = "";
        document.body.style.cursor = "";

        const preview = document.getElementById("previewFrame");
        if (preview) preview.style.pointerEvents = "auto";

        try {
          handle.releasePointerCapture(e.pointerId);
        } catch (err) {}
      }

      handle.addEventListener("dblclick", () => {
        workspace.style.setProperty("--split-x", "50%");
        workspace.style.setProperty("--split-y", "50%");
      });

      handle.addEventListener("pointerdown", onPointerDown);
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);
      window.addEventListener("pointercancel", onPointerUp);
    }

    /* ==========================================================================
       12. INITIALIZATION
       ========================================================================== */
    window.addEventListener("DOMContentLoaded", () => {
      loadPersistedSettings();
      updateSettingsUI();
      recordLatestState("Initial workspace state");
      updateSnapshotCountBadge();
      updateRollbackUI();
      renderFileTree();
      loadFileToEditor(activeFilePath);
      refreshPreview();
      initResizeHandle();
      
      const messagesContainer = document.getElementById("messagesContainer");
      if (messagesContainer) {
        messagesContainer.addEventListener("scroll", handleChatScroll, { passive: true });
      }

      addChatMessage("assistant", "Hello! I am WebPi, your autonomous coding agent running sandboxed, 100% in the browser. Only a local AI server is needed (see settings). Tell me what you'd like to build!");
    });
  </script>
</body>
