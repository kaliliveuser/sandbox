<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WebPi - Autonomous Coding Agent</title>
  <style>
    /* ==========================================================================
       AIR-GAPPED EMBEDDED CSS (ZERO EXTERNAL DEPENDENCIES)
       THEME VARIABLES & PRESETS
       ========================================================================== */
    :root, [data-theme="dark"] {
      --bg-darkest: #070b14;
      --bg-dark: #0f172a;
      --bg-surface: #1e293b;
      --bg-surface-hover: #334155;
      --border-color: #243049;
      --border-focus: #7c3aed;
      --brand-primary: #7c3aed;
      --brand-hover: #6d28d9;
      --brand-light: #ede9fe;
      --brand-muted: #4c1d95;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      
      --header-bg: rgba(15, 23, 42, 0.95);
      --handle-bg: #1e1b4b;
      --tool-bg: #090c18;
      --tool-top-bg: rgba(26, 16, 56, 0.6);
      --tool-body-bg: rgba(7, 11, 20, 0.95);
      --tool-resp-bg: rgba(11, 17, 32, 0.95);
      --tool-resp-body-bg: #070b14;
      --bubble-sys-bg: rgba(30, 41, 59, 0.6);
      --modal-bg: rgba(7, 11, 20, 0.85);
    }

    [data-theme="light"] {
      --bg-darkest: #f1f5f9;
      --bg-dark: #ffffff;
      --bg-surface: #f8fafc;
      --bg-surface-hover: #e2e8f0;
      --border-color: #cbd5e1;
      --border-focus: #6366f1;
      --brand-primary: #6366f1;
      --brand-hover: #4f46e5;
      --brand-light: #312e81;
      --brand-muted: #c7d2fe;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-dim: #64748b;
      --accent-green: #059669;
      --accent-amber: #d97706;
      --accent-rose: #e11d48;
      
      --header-bg: rgba(255, 255, 255, 0.96);
      --handle-bg: #e0e7ff;
      --tool-bg: #f8fafc;
      --tool-top-bg: rgba(238, 242, 255, 0.9);
      --tool-body-bg: #ffffff;
      --tool-resp-bg: #f1f5f9;
      --tool-resp-body-bg: #ffffff;
      --bubble-sys-bg: rgba(226, 232, 240, 0.8);
      --modal-bg: rgba(15, 23, 42, 0.5);
    }

    [data-theme="nord"] {
      --bg-darkest: #242933;
      --bg-dark: #2e3440;
      --bg-surface: #3b4252;
      --bg-surface-hover: #434c5e;
      --border-color: #4c566a;
      --border-focus: #88c0d0;
      --brand-primary: #5e81ac;
      --brand-hover: #81a1c1;
      --brand-light: #eceff4;
      --brand-muted: #3b4252;
      --text-main: #eceff4;
      --text-muted: #d8dee9;
      --text-dim: #9aa5b8;
      --accent-green: #a3be8c;
      --accent-amber: #ebcb8b;
      --accent-rose: #bf616a;
      
      --header-bg: rgba(46, 52, 64, 0.95);
      --handle-bg: #3b4252;
      --tool-bg: #1e222a;
      --tool-top-bg: rgba(46, 52, 64, 0.85);
      --tool-body-bg: #242933;
      --tool-resp-bg: #2e3440;
      --tool-resp-body-bg: #1e222a;
      --bubble-sys-bg: rgba(59, 66, 82, 0.6);
      --modal-bg: rgba(36, 41, 51, 0.85);
    }

    [data-theme="cyberpunk"] {
      --bg-darkest: #0d091a;
      --bg-dark: #17112c;
      --bg-surface: #221844;
      --bg-surface-hover: #312160;
      --border-color: #3b2873;
      --border-focus: #f43f5e;
      --brand-primary: #ec4899;
      --brand-hover: #db2777;
      --brand-light: #fce7f3;
      --brand-muted: #831843;
      --text-main: #fdf2f8;
      --text-muted: #f472b6;
      --text-dim: #9d71a5;
      --accent-green: #06b6d4;
      --accent-amber: #fbbf24;
      --accent-rose: #f43f5e;
      
      --header-bg: rgba(23, 17, 44, 0.95);
      --handle-bg: #37184f;
      --tool-bg: #0d091a;
      --tool-top-bg: rgba(59, 24, 82, 0.7);
      --tool-body-bg: #120b22;
      --tool-resp-bg: #190f30;
      --tool-resp-body-bg: #0d091a;
      --bubble-sys-bg: rgba(34, 24, 68, 0.7);
      --modal-bg: rgba(13, 9, 26, 0.85);
    }

    [data-theme="matrix"] {
      --bg-darkest: #030804;
      --bg-dark: #071209;
      --bg-surface: #0f2413;
      --bg-surface-hover: #16361c;
      --border-color: #194622;
      --border-focus: #10b981;
      --brand-primary: #10b981;
      --brand-hover: #059669;
      --brand-light: #d1fae5;
      --brand-muted: #064e3b;
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --text-dim: #347d53;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      
      --header-bg: rgba(7, 18, 9, 0.95);
      --handle-bg: #0d2812;
      --tool-bg: #040a05;
      --tool-top-bg: rgba(15, 36, 19, 0.8);
      --tool-body-bg: #030804;
      --tool-resp-bg: #071209;
      --tool-resp-body-bg: #020503;
      --bubble-sys-bg: rgba(15, 36, 19, 0.7);
      --modal-bg: rgba(3, 8, 4, 0.85);
    }

    /* Additional Theme Polish for Light Mode */
    [data-theme="light"] .diff-removed { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
    [data-theme="light"] .diff-added { background: #dcfce7; border-color: #86efac; color: #166534; }
    [data-theme="light"] .tool-call-header { color: var(--text-main); }
    [data-theme="light"] .tool-call-body { color: var(--text-main); }
    [data-theme="light"] .tool-response-body { color: var(--text-muted); }
    [data-theme="light"] .tool-response-header:hover { background: rgba(0, 0, 0, 0.04); }
    [data-theme="light"] .code-editor { background: #ffffff; color: #0f172a; }
    [data-theme="light"] .prompt-textarea { background: #ffffff; color: #0f172a; }
    [data-theme="light"] .input-control { background: #ffffff; color: #0f172a; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg-darkest); color: var(--text-main); font-family: var(--font-sans); font-size: 13px; }
    
    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

    /* App Shell */
    .app-container { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100vw; }
    header { height: 52px; background: var(--header-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; flex-shrink: 0; z-index: 20; }
    
    .brand-group { display: flex; align-items: center; gap: 0.75rem; }
    .brand-logo { width: 32px; height: 32px; border-radius: 8px; background: var(--brand-primary); display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
    .brand-title { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 0.5rem; }
    .badge { font-size: 11px; font-weight: normal; padding: 2px 8px; border-radius: 9999px; background: rgba(76, 29, 149, 0.5); color: var(--brand-light); border: 1px solid rgba(124, 58, 237, 0.4); }
    
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; background: transparent; color: var(--text-main); white-space: nowrap; }
    .btn:hover { background: var(--bg-surface-hover); }
    .btn-primary { background: var(--brand-primary); color: #fff; box-shadow: 0 2px 6px rgba(124, 58, 237, 0.3); }
    .btn-primary:hover { background: var(--brand-hover); }
    .btn-outline { background: var(--bg-surface); border-color: var(--border-color); color: var(--text-muted); }
    .btn-outline:hover { background: var(--bg-surface-hover); color: var(--text-main); }

    /* Mobile Navigation Tabs (Hidden on Desktop) */
    .mobile-nav-tabs { display: none; }

    /* Workspace & Resizable Grid Layout */
    .workspace {
      --split-x: 50%;
      --split-y: 50%;
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Centre Intersection Cross-Shaped Handle */
    .cross-handle {
      position: absolute;
      left: var(--split-x, 50%);
      top: var(--split-y, 50%);
      transform: translate(-50%, -50%);
      width: 30px;
      height: 30px;
      background: var(--handle-bg);
      border: 2px solid var(--brand-primary);
      border-radius: 50%;
      color: var(--brand-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: all-scroll;
      z-index: 50;
      box-shadow: 0 0 0 2px var(--bg-darkest), 0 4px 14px rgba(0, 0, 0, 0.65);
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
      user-select: none;
      touch-action: none;
    }
    .cross-handle:hover,
    .cross-handle.active {
      background: var(--brand-primary);
      color: #ffffff;
      border-color: #c4b5fd;
      transform: translate(-50%, -50%) scale(1.15);
      box-shadow: 0 0 0 2px var(--bg-darkest), 0 0 16px rgba(124, 58, 237, 0.9);
    }
    
    .pane-col-left {
      width: var(--split-x, 50%);
      flex: none;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      border-right: 1px solid var(--border-color);
    }

    .pane-col-right {
      width: calc(100% - var(--split-x, 50%));
      flex: none;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100%;
      background: var(--bg-darkest);
    }

    /* Top Left: Files Pane */
    .pane-files {
      height: var(--split-y, 50%);
      flex: none;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .file-tree { flex: 1; overflow-y: auto; padding: 8px; }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; border-radius: 5px; cursor: pointer; color: var(--text-muted); font-size: 12px; margin-bottom: 2px; }
    .file-item:hover { background: var(--bg-surface); color: var(--text-main); }
    .file-item.active { background: rgba(124, 58, 237, 0.2); color: var(--brand-light); font-weight: 600; border: 1px solid rgba(124, 58, 237, 0.3); }

    /* Bottom Left: Chat Pane */
    .pane-chat {
      height: calc(100% - var(--split-y, 50%));
      flex: none;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }
    .pane-header { padding: 8px 12px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; background: var(--bg-dark); flex-shrink: 0; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    
    /* Scroll to bottom floating button */
    .scroll-bottom-btn {
      position: absolute;
      bottom: 14px;
      right: 18px;
      background: var(--bg-surface);
      color: var(--brand-light);
      border: 1px solid var(--brand-primary);
      border-radius: 9999px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .scroll-bottom-btn:hover {
      background: var(--brand-primary);
      color: #fff;
      transform: translateY(-1px);
    }

    /* Messages & Reasoning */
    .msg-wrap { display: flex; flex-direction: column; width: 100%; }
    .msg-wrap.user { align-items: flex-end; }
    .msg-wrap.assistant { align-items: flex-start; }
    .bubble { max-width: 92%; border-radius: 10px; padding: 10px 14px; font-size: 12px; line-height: 1.5; word-break: break-word; }
    .bubble.user { background: var(--brand-primary); color: #fff; border-bottom-right-radius: 2px; }
    .bubble.assistant { background: var(--bg-surface); color: var(--text-main); border-bottom-left-radius: 2px; border: 1px solid var(--border-color); width: 100%; }
    .bubble.system { width: 100%; background: var(--bubble-sys-bg); border: 1px solid var(--border-color); color: var(--text-muted); font-family: var(--font-mono); }

    .thought-box { margin-bottom: 8px; border-radius: 8px; background: var(--tool-bg); border: 1px solid var(--border-color); overflow: hidden; }
    .thought-header { width: 100%; padding: 6px 10px; background: var(--bg-surface); display: flex; align-items: center; justify-content: space-between; cursor: pointer; border: none; color: var(--text-muted); font-size: 11px; }
    .thought-header:hover { background: var(--bg-surface-hover); color: var(--text-main); }
    .thought-body { padding: 8px 10px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; max-height: 220px; overflow-y: auto; white-space: pre-wrap; line-height: 1.4; }

    @keyframes pulseGlow {
      0% { opacity: 0.6; border-color: rgba(124, 58, 237, 0.4); }
      50% { opacity: 1; border-color: rgba(124, 58, 237, 1); }
      100% { opacity: 0.6; border-color: rgba(124, 58, 237, 0.4); }
    }

    /* ==========================================================================
       STACKED TOOL CALLS & RESPONSES
       ========================================================================== */
    .tool-call-item {
      margin-top: 8px;
      border-radius: 6px;
      background: var(--tool-bg);
      border: 1px solid var(--border-focus);
      overflow: hidden;
      font-family: var(--font-mono);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      width: 100%;
    }
    .tool-call-item.tool-error {
      border-color: rgba(244, 63, 94, 0.6);
    }

    /* Top: Tool Call */
    .tool-call-top {
      display: flex;
      flex-direction: column;
      background: var(--tool-top-bg);
    }
    .tool-call-header {
      width: 100%;
      padding: 6px 8px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      color: var(--brand-light);
      font-family: var(--font-mono);
      font-size: 11px;
      cursor: pointer;
      text-align: left;
      user-select: none;
    }
    .tool-call-header:hover {
      background: rgba(124, 58, 237, 0.15);
    }
    .tool-call-header.streaming {
      animation: pulseGlow 1.5s infinite ease-in-out;
    }
    .tool-call-title-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
      flex: 1;
      word-break: break-word;
    }
    .tool-call-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-left: auto;
    }
    .tool-call-body {
      padding: 8px;
      border-top: 1px dashed var(--border-color);
      background: var(--tool-body-bg);
      max-height: 220px;
      overflow-y: auto;
      color: var(--text-main);
      font-size: 11px;
    }

    /* Bottom: Tool Response */
    .tool-response-bottom {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border-color);
      background: var(--tool-resp-bg);
    }
    .tool-response-bottom.error {
      border-top-color: rgba(244, 63, 94, 0.5);
      background: rgba(244, 63, 94, 0.1);
    }
    .tool-response-bottom.running {
      background: var(--bg-surface);
    }
    .tool-response-header {
      width: 100%;
      padding: 6px 8px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      text-align: left;
      cursor: pointer;
      user-select: none;
    }
    .tool-response-header:hover {
      background: var(--bg-surface-hover);
    }
    .tool-response-summary {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
      flex: 1;
      word-break: break-word;
    }
    .tool-response-body {
      padding: 8px;
      border-top: 1px dashed var(--border-color);
      background: var(--tool-resp-body-bg);
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .tool-response-body.error {
      color: var(--accent-rose);
      border-top-color: rgba(244, 63, 94, 0.3);
    }

    .tool-diff-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-top: 4px; margin-bottom: 2px; }
    .diff-removed { background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #fca5a5; padding: 6px; border-radius: 4px; max-height: 140px; overflow-y: auto; font-family: var(--font-mono); font-size: 11px; white-space: pre-wrap; word-break: break-all; }
    .diff-added { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #86efac; padding: 6px; border-radius: 4px; max-height: 140px; overflow-y: auto; font-family: var(--font-mono); font-size: 11px; white-space: pre-wrap; word-break: break-all; }

    /* Expandable Standalone Tool Results */
    .tool-output-box { width: 100%; border-radius: 8px; background: var(--tool-bg); border: 1px solid var(--border-focus); overflow: hidden; font-family: var(--font-mono); margin-top: 6px; }
    .tool-output-header { width: 100%; padding: 6px 10px; background: var(--bg-surface); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; cursor: pointer; border: none; color: var(--brand-light); font-size: 11px; font-family: var(--font-mono); text-align: left; }
    .tool-output-header:hover { background: var(--bg-surface-hover); }
    .tool-output-body { padding: 8px 10px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; max-height: 240px; overflow-y: auto; white-space: pre-wrap; line-height: 1.4; word-break: break-all; }

    /* Chat Input */
    .chat-input-area { padding: 10px; border-top: 1px solid var(--border-color); background: var(--bg-dark); flex-shrink: 0; }
    .prompt-textarea { width: 100%; background: var(--bg-darkest); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; color: var(--text-main); font-size: 12px; font-family: var(--font-sans); resize: none; outline: none; }
    .prompt-textarea:focus { border-color: var(--brand-primary); }

    /* Top Right: Editor Pane */
    .editor-pane { height: var(--split-y, 50%); flex: none; display: flex; flex-direction: column; border-bottom: 1px solid var(--border-color); min-height: 0; }
    .code-editor { flex: 1; width: 100%; height: 100%; padding: 12px; background: var(--bg-darkest); color: var(--text-main); font-family: var(--font-mono); font-size: 12px; line-height: 1.6; border: none; outline: none; resize: none; }
    
    /* Bottom Right: Preview Pane */
    .preview-pane { height: calc(100% - var(--split-y, 50%)); flex: none; display: flex; flex-direction: column; min-height: 0; background: #fff; }
    .preview-frame { width: 100%; height: 100%; border: none; background: #fff; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: var(--modal-bg); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-dialog { width: 100%; max-width: 520px; background: var(--bg-dark); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .modal-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; max-height: 80vh; overflow-y: auto; }
    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-label { font-size: 11px; font-weight: 600; color: var(--text-muted); }
    .input-control { width: 100%; background: var(--bg-darkest); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; color: var(--text-main); font-size: 12px; outline: none; }
    .input-control:focus { border-color: var(--brand-primary); }

    .status-bar { padding: 6px 12px; background: var(--bg-darkest); border-top: 1px solid var(--border-color); font-size: 11px; color: var(--brand-light); display: none; align-items: center; justify-content: space-between; flex-shrink: 0; }
    .hidden { display: none !important; }

    /* ==========================================================================
       MOBILE RESPONSIVE OVERRIDES
       ========================================================================== */
    @media (max-width: 768px) {
      header { padding: 0 8px; }
      .brand-title span#modelBadge { display: none; }
      .btn-label { display: none; }
      header .btn { padding: 6px 8px; }

      .mobile-nav-tabs {
        display: flex;
        background: var(--bg-dark);
        border-bottom: 1px solid var(--border-color);
        flex-shrink: 0;
        z-index: 25;
      }
      .mobile-tab-btn {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;

</head>
